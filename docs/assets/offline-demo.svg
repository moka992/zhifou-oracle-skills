<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 659" width="1120" height="659" role="img"><title>Reproducible offline I Ching and tarot tool output; no model was called</title><rect width="1120" height="659" rx="8" fill="#171B23" /><text x="38" y="43" fill="#AEBBD0" font-family="system-ui, sans-serif" font-size="16">ZHIFOU ORACLE SKILLS  /  REPRODUCIBLE LOCAL DEMO</text><line x1="38" y1="65" x2="1082" y2="65" stroke="#384354" /><text x="38" y="103" fill="#7FE1B1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">$ python3 tools/demo.py</text><text x="38" y="132" fill="#F1F5FA" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" /><text x="38" y="161" fill="#F1F5FA" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">ZHIFOU ORACLE / OFFLINE DEMO</text><text x="38" y="190" fill="#BCC8D9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">Fixed imports. No new random draw. No API key.</text><text x="38" y="219" fill="#F1F5FA" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" /><text x="38" y="248" fill="#F1F5FA" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">铜钱卦 / I CHING</text><text x="38" y="277" fill="#F1F5FA" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">  6  7  8  9  7  8  (bottom -&gt; top)</text><text x="38" y="306" fill="#F1F5FA" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">  #47 困 -&gt; #60 節</text><text x="38" y="335" fill="#F1F5FA" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">  Moving lines: 1, 4</text><text x="38" y="364" fill="#7FE1B1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">  Receipt consistency: PASS</text><text x="38" y="393" fill="#F1F5FA" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" /><text x="38" y="422" fill="#F1F5FA" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">韦特塔罗 / THREE-CARD TAROT</text><text x="38" y="451" fill="#F1F5FA" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">  situation: Strength / upright</text><text x="38" y="480" fill="#F1F5FA" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">  challenge: Two of Cups / reversed</text><text x="38" y="509" fill="#F1F5FA" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">  next_step: Temperance / upright</text><text x="38" y="538" fill="#7FE1B1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">  Modified orientation rejected: PASS</text><text x="38" y="567" fill="#F1F5FA" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" /><text x="38" y="596" fill="#F1F5FA" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">No model called. Local tools supply outcomes and sources.</text><text x="38" y="625" fill="#BCC8D9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">Consistency checks do not establish predictive validity.</text></svg>